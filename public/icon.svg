  <!-- Modern Geometric 'I' -->
  <rect x="22" y="32" width="13" height="42" rx="6.5" fill="#ffffff" />
  <circle cx="28.5" cy="21" r="6.5" fill="#38bdf8" />
  
  <!-- Modern Geometric 'P' -->
  <!-- Stem -->
  <rect x="44" y="21" width="13" height="53" rx="6.5" fill="#ffffff" />
  <!-- Bowl -->
  <path d="M50 21 C67 21 78 30 78 42 C78 54 67 61 50 61 Z" fill="#38bdf8" />
  <path d="M50 31 C59 31 66 36 66 42 C66 48 59 51 50 51 Z" fill="#0284c7" />
  
