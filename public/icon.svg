<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <title>FreeSSL IP - Quantum Cube Logo</title>
  <!-- Futuristic Dark Squircle Frame -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Isometric Quantum Cube -->
  <!-- Top Face (Light Ice Blue) -->
  <polygon points="50,18 82,36 50,54 18,36" fill="#38bdf8" />
  
  <!-- Left Face (Tech Sky Blue) -->
  <polygon points="18,36 50,54 50,86 18,68" fill="#0284c7" />
  
  <!-- Right Face (Deep Cyber Blue) -->
  <polygon points="50,54 82,36 82,68 50,86" fill="#0369a1" />
  
  <!-- Inner Data Core Glow -->
  <circle cx="50" cy="54" r="8" fill="#ffffff" />
  <circle cx="50" cy="54" r="4.5" fill="#10b981" />
  
  <!-- Circuit & Measurement Line -->
  <polyline points="50,18 50,6 76,6" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="76" cy="6" r="2.5" fill="#38bdf8" />
</svg>
